# Sample honey.conf for the Kernel-Level Honeypot driver.
#
# The driver expects this file at \SystemRoot\Release\honey.conf
# (i.e. C:\Windows\Release\honey.conf on a default Windows install).
# Copy this sample there at install time; see BUILD.md, "Installation".
#
# Format: one `key=value` per line. Comment lines start with `#`.

# Layer master switches.
TriggerLayerEnabled=1
DetectionLayerEnabled=1
DeceptionLayerEnabled=1
LoggingLayerEnabled=1
ExtractionLayerEnabled=1

# Trigger layer.
MaxFakeRegistryKeys=64
MaxHookedFunctions=16

# Detection layer.
MaxSyscallLogEntries=4096
StackFingerprintingEnabled=1
MemoryTrackingEnabled=1

# Deception layer.
MaxFakeProcesses=8
MaxFakeThreads=16
FakeStructureUpdateInterval=60

# Logging layer.
LogBufferSize=65536
EncryptionEnabled=1
ExportIntervalSeconds=30

# Extraction layer.
DisassemblerEnabled=1
ExploitFingerprintingEnabled=1

# Remote update (placeholder; see ControlLayer.{c,h}).
RemoteUpdateEnabled=0
RemoteUpdateUrl=
